name: Risk tier

# Labels every pull request risk:low or risk:high from the files it changes
# (scripts/risk-tier.mjs), and turns on auto-merge for the low tier.
#
# Auto-merge only waits for the required checks in the "Main Protection"
# ruleset, so a low-risk pull request merges once CI passes. It applies to:
#   - pull requests the repo owner opens (including ones an agent opens for
#     them), when every commit is authored by the owner and the owner triggered
#     this run (a push by anyone else turns auto-merge off)
#   - Dependabot patch and minor updates that change only package.json and
#     lockfiles, when every commit is Dependabot's
# Anyone else's pull request is labeled but never merged automatically.
# Add the "hold" label to keep any pull request from merging on its own.
#
# Security: this runs on pull_request_target so it can label and merge, which
# means it has a write token. It must never check out or run code from the
# pull request. It checks out the base branch, so the classifier is the
# reviewed copy on main, and treats the pull request's file names as data.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions: {}

concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tier:
    name: Risk tier
    runs-on: ubuntu-latest
    permissions:
      contents: write # enable auto-merge
      pull-requests: write # labels and auto-merge
      issues: write # create the labels if they don't exist yet
    steps:
      # On pull_request_target the default checkout is the base branch, never the
      # pull request's code. Don't add a `ref:` here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Dependabot metadata
        id: deps
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        # If this can't read the update type, the pull request stays high risk.
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Classify and apply
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          ACTOR: ${{ github.actor }}
          # Differs from ACTOR when someone re-runs an old run; then nobody is trusted.
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          UPDATE_TYPE: ${{ steps.deps.outputs.update-type }}
        run: |
          set -euo pipefail

          # Every file, and the old name of anything renamed. A name with a control
          # character (a newline could split one path into two) counts as high risk.
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)
                  | if test("[[:cntrl:]]") then "!control-character-in-path" else . end' \
            > "$RUNNER_TEMP/files.txt"
          node scripts/risk-tier.mjs < "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/tier.json"
          tier=$(jq -r .tier "$RUNNER_TEMP/tier.json")
          why="files"

          # Per commit: author, whether the signature verified, and who signed it as
          # committer. The API lists at most 250, so a longer pull request counts as
          # unknown. author.login comes from the commit email, which anyone who can
          # push could fake, and "verified" only means someone's key signed it.
          # Dependabot's commits are signed by GitHub itself (committer web-flow),
          # so those must be verified and committed by web-flow.
          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | (.author.login // "!unknown") + " " + (.commit.verification.verified | tostring)
                  + " " + (.committer.login // "!unknown")' \
            > "$RUNNER_TEMP/authors.txt"
          commits=$(grep -c '' "$RUNNER_TEMP/authors.txt" || true)
          # only_by LOGIN [signed]: every commit is by LOGIN (and, with "signed",
          # verified and signed by GitHub as web-flow).
          only_by() {
            [ "$commits" -gt 0 ] && [ "$commits" -lt 250 ] || return 1
            awk -v want="$1" -v signed="${2:-}" \
              '$1 != want || (signed == "signed" && ($2 != "true" || $3 != "web-flow")) { bad = 1 } END { exit bad }' \
              "$RUNNER_TEMP/authors.txt"
          }
          [ "$TRIGGERING_ACTOR" = "$ACTOR" ] || ACTOR="!rerun-by-$TRIGGERING_ACTOR"

          # Dependabot patch and minor bumps that only touch manifests and lockfiles.
          # Majors stay high: they can change behaviour.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            deps_only=$(jq -r .dependenciesOnly "$RUNNER_TEMP/tier.json")
            case "$UPDATE_TYPE" in
              version-update:semver-patch|version-update:semver-minor)
                if [ "$deps_only" = true ]; then tier=low; else tier=high; fi
                why="dependabot $UPDATE_TYPE, dependency files only: $deps_only" ;;
              *) tier=high; why="dependabot ${UPDATE_TYPE:-unknown update}" ;;
            esac
          fi

          gh label create risk:low --repo "$REPO" --color 0E8A16 --description "Can merge once CI passes" --force >/dev/null
          gh label create risk:high --repo "$REPO" --color B60205 --description "Needs a human to review and merge" --force >/dev/null
          gh label create hold --repo "$REPO" --color FBCA04 --description "Never merge automatically" --force >/dev/null
          other=$([ "$tier" = low ] && echo high || echo low)
          gh pr edit "$PR" --repo "$REPO" --add-label "risk:$tier" --remove-label "risk:$other" >/dev/null

          # Who may skip a human: the owner's own pull requests, when the owner
          # wrote every commit and triggered this run; and Dependabot's, when
          # Dependabot wrote every commit and it or the owner triggered this run.
          trusted=false
          if [ "$ASSOCIATION" = "OWNER" ] && [ "$ACTOR" = "$OWNER" ] && only_by "$OWNER"; then trusted=true; fi
          if [ "$AUTHOR" = "dependabot[bot]" ] && { [ "$ACTOR" = "dependabot[bot]" ] || [ "$ACTOR" = "$OWNER" ]; } \
            && only_by "dependabot[bot]" signed; then
            trusted=true
          fi
          held=false
          case ",$LABELS," in *,hold,*) held=true ;; esac

          {
            echo "### Risk tier: $tier"
            echo
            echo "Decided by: $why. Trusted author: $trusted. Draft: $DRAFT. Hold: $held."
            if [ "$tier" = high ] && [ "$why" = files ]; then
              echo
              echo "Files that need a human:"
              jq -r '.highRisk[] | "- `" + . + "`"' "$RUNNER_TEMP/tier.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$tier" = low ] && [ "$trusted" = true ] && [ "$DRAFT" = false ] && [ "$held" = false ]; then
            # Only the commit that was checked here may merge; a newer push gets its own run.
            if ! gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA"; then
              echo "::warning::Could not turn on auto-merge. Is 'Allow auto-merge' on in the repository settings?"
            fi
          else
            # A later push can raise the tier, or someone adds "hold": stop any pending auto-merge.
            gh pr merge "$PR" --repo "$REPO" --disable-auto >/dev/null 2>&1 || true
          fi
