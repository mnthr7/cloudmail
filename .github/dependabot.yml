version: 2
updates:
  # Dependabot's bun ecosystem keeps bun.lock in step with package.json, so
  # CI's `bun install --frozen-lockfile` passes on its PRs.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
