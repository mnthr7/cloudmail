name: Release

# Cut a release:
#   git tag v1.1.0 && git push origin v1.1.0
#
# The zip is for anyone who wants a pinned copy rather than a `git pull`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build a release from (e.g. v1.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # The full CI gate on the exact commit being released, tests included: a
      # tag can point at a commit CI never saw, and an old green run is no
      # proof for it. The clean check runs first, so nothing ships with
      # personal config in it.
      - name: Clean check, typecheck, test, build
        run: bun run ci

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          # Later steps interpolate the tag into shell, so allow version characters only.
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "Refusing tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # git archive honours the export-ignore rules in .gitattributes, so the zip
      # carries the product without the maintainer tooling.
      - name: Package
        run: |
          git archive --format=zip \
            --prefix="cloudmail-${{ steps.version.outputs.version }}/" \
            -o "cloudmail-${{ steps.version.outputs.version }}.zip" \
            "${{ steps.version.outputs.tag }}"
          unzip -l "cloudmail-${{ steps.version.outputs.version }}.zip" | tail -5

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "cloudmail-${{ steps.version.outputs.version }}.zip" \
            --title "CloudMail ${{ steps.version.outputs.tag }}" \
            --generate-notes
