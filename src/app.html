<!doctype html>
<html lang="en" data-skin="%qm.skin%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script nonce="%sveltekit.nonce%">
			// Resolve the theme before first paint so there is no light flash.
			(() => {
				try {
					const stored = localStorage.getItem('mail:theme') || 'system';
					// Light/Dark belongs to the Classic skin; the paper skins are always light.
					const classic = document.documentElement.dataset.skin === 'classic';
					const dark =
						classic &&
						(stored === 'dark' ||
							(stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch {
					document.documentElement.dataset.theme = 'light';
				}
			})();
			// Reading pane is also local — stamp it so the inbox layout is correct
			// on the first paint after refresh.
			(() => {
				try {
					const fallback = document.documentElement.dataset.skin === 'ledger' ? 'below' : 'right';
					const stored = localStorage.getItem('mail:reading-pane') || fallback;
					document.documentElement.dataset.readingPane =
						stored === 'none' || stored === 'right' || stored === 'below' ? stored : fallback;
				} catch {
					document.documentElement.dataset.readingPane = 'right';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
