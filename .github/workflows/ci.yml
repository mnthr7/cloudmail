name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; only the newest head can
# merge. Pushes to main are never cancelled: each merged commit gets checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # This name is the required check in the "Main Protection" ruleset; keep it.
    name: Verify the template
    runs-on: ubuntu-latest
    # A normal run takes under a minute; don't let a hang hold a runner for 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # scripts/ci-verify.sh: the template-clean check runs first and alone (a
      # leaked secret fails before anything else touches it), then typecheck
      # and build run with the unit tests alongside. Same as `bun run ci`.
      - name: Clean check, typecheck, test, build
        run: bun run ci
